server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/pulsenotify
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Switched to validate because of Flyway
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 # 256-bit secret for local dev
    expirationMs: 3600000 # 1 hour
    refreshExpirationMs: 86400000 # 24 hours

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:dummy-key}
        secret-key: ${AWS_SECRET_ACCESS_KEY:dummy-secret}
      region:
        static: ${AWS_REGION:us-east-1}
      sqs:
        endpoint: ${SQS_ENDPOINT:http://localhost:4566}

cloud:
  aws:
    sqs:
      queue-name: ${SQS_QUEUE_NAME:pulse-notify-main-queue}
